name: Release (arm64-v8a)

# Pushing an annotated version tag (v1.0.0, v1.1.0, ...) builds a signed,
# arm64-v8a-only release APK and attaches it to the GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build signed arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # ubuntu-latest already ships the Android SDK with licenses accepted.
      - name: Install required SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android Lint gate
        run: ./gradlew lintDebug --stacktrace

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          STORE_PASS="${STORE_PASS:-volumemanager}"
          KEY_PASS="${KEY_PASS:-$STORE_PASS}"
          KEY_ALIAS="${KEY_ALIAS:-volume}"
          if [ -n "${KEYSTORE_B64}" ]; then
            printf '%s' "${KEYSTORE_B64}" | base64 --decode > app/release.jks
            echo "Using keystore from repository secrets"
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret set; generating an ephemeral CI keystore"
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Volume Manager, OU=Volume Manager, O=Mostakim2005, L=Dhaka, ST=Dhaka, C=BD"
          fi
          {
            echo "VM_STORE_PASSWORD=$STORE_PASS"
            echo "VM_KEY_PASSWORD=$KEY_PASS"
            echo "VM_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect and rename APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          cp "$APK" "VolumeManager-arm64-v8a-${GITHUB_REF_NAME}.apk"
          echo "Built from: $APK"
          ls -l "VolumeManager-arm64-v8a-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: VolumeManager-arm64-v8a-*.apk
          generate_release_notes: true
